services:
  speakflow:
    image: speakflow:1.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    env_file:
      - ./speakflow.env
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      AUDIO_DIRECTORY: /tmp/speakflow-audio
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
