spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:speakflow}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:DISABLED}
    username: ${DB_USERNAME:speakflow}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  forward-headers-strategy: framework
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
  ai:
    provider: ${AI_PROVIDER:local}
    model: ${AI_MODEL:gpt-4.1-mini}
    api-key: ${AI_API_KEY:}

    tts-model: ${AI_TTS_MODEL:tts-1}
    asr-model: ${AI_ASR_MODEL:whisper-1}
    voice: ${AI_TTS_VOICE:alloy}
    base-url: ${AI_BASE_URL:https://api.openai.com}
  audio:
    directory: ${AUDIO_DIRECTORY:./audio-cache}
